<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Teal Gradient -->
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00E5EE" />
      <stop offset="50%" stop-color="#00C4CC" />
      <stop offset="100%" stop-color="#00969B" />
    </linearGradient>

    <!-- Outer Rim Highlight -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#73FAFF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#005B60" stop-opacity="0.9" />
    </linearGradient>

    <!-- Star Fill Gradient -->
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#051D28" />
      <stop offset="100%" stop-color="#020E15" />
    </linearGradient>

    <!-- Star Rim Highlight Gradient -->
    <linearGradient id="starRimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#69F5FF" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#00C4CC" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#004347" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Full-bleed Squircle Background (Max Dimensions) -->
  <rect x="0" y="0" width="512" height="512" rx="136" fill="url(#tealGrad)" />

  <!-- Outer Border Rim Gloss -->
  <rect x="6" y="6" width="500" height="500" rx="130" fill="none" stroke="url(#rimGrad)" stroke-width="12" />

  <!-- Inner Bevel Highlight -->
  <rect x="20" y="20" width="472" height="472" rx="116" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="4" />

  <!-- Outer Star Soft Rim Shadow/Glow -->
  <path d="M 256 128 C 256 200 312 256 384 256 C 312 256 256 312 256 384 C 256 312 200 256 128 256 C 200 256 256 200 256 128 Z" fill="none" stroke="url(#starRimGrad)" stroke-width="12" stroke-linejoin="round" />

  <!-- Central Star/Sparkle (4-point curved) -->
  <path d="M 256 136 C 256 204 308 256 376 256 C 308 256 256 308 256 376 C 256 308 204 256 136 256 C 204 256 256 204 256 136 Z" fill="url(#starGrad)" />
</svg>
